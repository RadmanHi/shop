spring.application.name=shop

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

shop.search.size.min=1
shop.search.size.max=250

scheduled.expire.stale.checkout.enabled=true
shop.checkout.timeout-job.fixed-delay-ms=60000